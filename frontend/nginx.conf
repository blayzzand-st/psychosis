server {
    listen 443 ssl;
    ssl_protocols TLSv1.3;
    ssl_certificate /etc/psychosis/tls/server.crt;
    ssl_certificate_key /etc/psychosis/tls/server.key;
    ssl_session_tickets off;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the backend after Docker replaces its container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend https://backend:8000;
    proxy_ssl_protocols TLSv1.3;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/psychosis/tls/ca.crt;
    proxy_ssl_server_name on;
    proxy_ssl_name backend;

    location = /api/audit/stream {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location ~ ^/(api(?:/|$)|docs(?:/|$)|redoc$|openapi\.json$) {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
