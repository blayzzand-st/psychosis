name: psychosis

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: psychosis
      POSTGRES_USER: psychosis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psychosis_local_dev}
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psychosis -d psychosis"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: psychosis
      PGUSER: psychosis
      PGPASSWORD: ${POSTGRES_PASSWORD:-psychosis_local_dev}
      API_HOST: 0.0.0.0
      TLS_DIR: /etc/psychosis/tls
    volumes:
      - ./.local/tls/backend.crt:/etc/psychosis/tls/backend.crt:ro
      - ./.local/tls/backend.key:/etc/psychosis/tls/backend.key:ro
      - ./.local/tls/ca.crt:/etc/psychosis/tls/ca.crt:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; c=ssl.create_default_context(cafile='/etc/psychosis/tls/ca.crt'); c.minimum_version=ssl.TLSVersion.TLSv1_3; urllib.request.urlopen('https://127.0.0.1:8000/api/health', context=c, timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8080}:443"
    volumes:
      - ./.local/tls/server.crt:/etc/psychosis/tls/server.crt:ro
      - ./.local/tls/server.key:/etc/psychosis/tls/server.key:ro
      - ./.local/tls/ca.crt:/etc/psychosis/tls/ca.crt:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --cacert /etc/psychosis/tls/ca.crt --tlsv1.3 --tls-max 1.3 https://127.0.0.1/ -o /dev/null && curl --fail --silent --cacert /etc/psychosis/tls/ca.crt --tlsv1.3 --tls-max 1.3 https://127.0.0.1/api/health -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data_v18:
